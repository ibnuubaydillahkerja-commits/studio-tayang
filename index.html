<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Studio Tayang Ibnu</title>
<meta name="theme-color" content="#151a2b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* ====== PENGATURAN ======
   Isi GITHUB_REPO di bagian <script> paling bawah (contoh: "ibnu123/studio-tayang")
   supaya tombol "Kirim perintah" langsung masuk ke tim AI. */
:root{
  --bg:#f3f4f7; --panel:#fff; --ink:#151a2b; --muted:#5d6479; --line:#e0e3ea;
  --accent:#e8590c; --accent-ink:#fff; --accent-soft:#fde8dc;
  --good:#1f8a4c; --good-soft:#dcf3e5; --mid:#a86a0c; --mid-soft:#fbf0d9; --bad:#c92a2a; --bad-soft:#fde2e2; --new:#4c5a8a; --new-soft:#e6e9f5;
  --yt:#e03131; --tt:#151a2b; --ig:#c2255c; --fb:#1c64d6;
  --f-d:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-b:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-m:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1220; --panel:#181c2e; --ink:#eef0f7; --muted:#9aa1b8; --line:#2a3048;
  --accent:#ff7a33; --accent-ink:#1a0c03; --accent-soft:#3a2214;
  --good:#4cc27e; --good-soft:#173527; --mid:#e3b04b; --mid-soft:#3a2f17; --bad:#ff6b6b; --bad-soft:#3d1c1f; --new:#9fb0ea; --new-soft:#232a45;
  --yt:#ff6b6b; --tt:#eef0f7; --ig:#f06595; --fb:#5c9cff; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(18px + env(safe-area-inset-top,0px)) 90px}
h1,h2{font-family:var(--f-d);margin:0;text-wrap:balance}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
h2{font-size:19px;font-weight:800}
.sub{color:var(--muted);font-size:13px}
.hero{background:var(--ink);color:var(--bg);border-radius:14px;padding:16px;margin-top:14px}
.hero p{margin:0;font-size:16px}
.hero .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.hero .nums div{background:rgba(127,127,127,.18);border-radius:10px;padding:8px 10px}
.hero b{display:block;font-family:var(--f-m);font-size:22px}
.hero span{font-size:12px;opacity:.8}
section{margin-top:26px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.day{font-family:var(--f-m);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.item{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.jam{font-family:var(--f-m);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.isi{min-width:0}
.jd{font-weight:600;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.pf{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.pf i{width:8px;height:8px;border-radius:50%;display:inline-block}
.tag{font-size:11px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.st{font-size:11px;font-weight:600;border-radius:999px;padding:2px 9px}
.st.terjadwal{background:var(--good-soft);color:var(--good)}
.st.siap{background:var(--new-soft);color:var(--new)}
.st.gagal{background:var(--bad-soft);color:var(--bad)}
.perf{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.perf a{color:var(--ink);text-decoration:none}
.perf a:hover{text-decoration:underline}
.vw{text-align:right}
.vw b{display:block;font-family:var(--f-m);font-size:20px;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;margin-top:2px}
.badge.bagus{background:var(--good-soft);color:var(--good)}
.badge.lumayan{background:var(--mid-soft);color:var(--mid)}
.badge.sepi{background:var(--bad-soft);color:var(--bad)}
.badge.baru{background:var(--new-soft);color:var(--new)}
.legend{font-size:12px;color:var(--muted);margin:-4px 0 10px}
.cmd{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
textarea{width:100%;min-height:90px;font:15px var(--f-b);border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chips button{font:500 13px var(--f-b);border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:6px 12px;cursor:pointer}
.go{width:100%;font:700 16px var(--f-b);border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);padding:13px;cursor:pointer}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.ok{font-size:13px;color:var(--good);margin-top:8px}
.empty{color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:16px;text-align:center}
.err{background:var(--bad-soft);border-radius:12px;padding:12px;font-size:14px;margin-top:14px}
.navbar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.navbar a{flex:1;text-align:center;color:var(--muted);text-decoration:none;font-size:12px;font-weight:600;padding:6px 0}
.navbar a span{display:block;font-size:18px}
a:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.done{font-size:13px;border-left:3px solid var(--good);padding:4px 10px;margin-top:6px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Studio Tayang</h1>
    <div class="sub" id="upd">Memuat…</div>
  </header>

  <div class="hero" id="hero"><p>Memuat ringkasan…</p></div>
  <div id="loadErr" class="err" hidden></div>

  <section id="tayang">
    <div class="sh"><h2>📅 Bakal tayang</h2></div>
    <div id="jadwal"><div class="empty">Memuat…</div></div>
  </section>

  <section id="views">
    <div class="sh"><h2>📊 Views & nilai</h2></div>
    <div class="legend">Nilai dihitung setelah video umur 2 hari. YouTube: bagus ≥ 200, sepi &lt; 50. TikTok/IG/FB: bagus ≥ 300, sepi &lt; 100.</div>
    <div id="performa"><div class="empty">Memuat…</div></div>
  </section>

  <section id="ide">
    <div class="sh"><h2>💡 Ide berikutnya</h2></div>
    <div id="ideList"><div class="empty">Memuat…</div></div>
  </section>

  <section id="perintah">
    <div class="sh"><h2>✍️ Kasih perintah</h2></div>
    <div class="cmd">
      <label for="cmdText" class="sub">Tulis aja maunya apa, tim AI yang ngerjain.</label>
      <textarea id="cmdText" placeholder="Contoh: bikin video bangun rumah kayu buat besok jam 10"></textarea>
      <div class="chips" id="chips">
        <button type="button">Bikin video bangun rumah lagi</button>
        <button type="button">Bikin fakta hewan buat besok</button>
        <button type="button">Bikin tips CSS buat TikTok</button>
        <button type="button">Majuin semua jam tayang ke 07:00</button>
        <button type="button">Stop posting besok</button>
      </div>
      <button type="button" class="go" id="send">Kirim perintah</button>
      <div class="hint" id="sendHint"></div>
      <div class="ok" id="sendOk" hidden></div>
    </div>
    <div id="doneList"></div>
  </section>
</div>

<nav class="navbar" aria-label="Menu">
  <a href="#tayang"><span>📅</span>Tayang</a>
  <a href="#views"><span>📊</span>Views</a>
  <a href="#ide"><span>💡</span>Ide</a>
  <a href="#perintah"><span>✍️</span>Perintah</a>
</nav>

<script>
// ====== ISI INI SETELAH BIKIN REPO GITHUB ======
const GITHUB_REPO = "ibnuubaydillahkerja-commits/studio-tayang";
// ===============================================

const TZ = 'Asia/Bangkok';
const NET = {youtube:['YouTube','var(--yt)'],tiktok:['TikTok','var(--tt)'],instagram:['Instagram','var(--ig)'],facebook:['Facebook','var(--fb)']};
const FMT = {DuckFact:'Fakta Kwek',BuildHouse:'Bangun rumah',TechTip:'Tips coding',WebShowcase:'Pamer website',FacelessShort:'Teks pendek',lainnya:'Lainnya'};
const $ = s=>document.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n=>n==null?'–':Number(n).toLocaleString('id-ID');

function todayWIB(){
  const p=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
  const g=t=>p.find(x=>x.type===t).value; return `${g('year')}-${g('month')}-${g('day')}`;
}
const addDays=(d,n)=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const namaHari=d=>new Date(d+'T12:00:00Z').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'});
function labelHari(d){const t=todayWIB();return d===t?'Hari ini':d===addDays(t,1)?'Besok':d===addDays(t,2)?'Lusa':namaHari(d)}
const pfHtml=list=>list.map(p=>{const n=NET[p]||[p,'var(--muted)'];return `<span class="pf"><i style="background:${n[1]}"></i>${esc(n[0])}</span>`}).join('');

function nilai(v){
  if (v.views==null) return null;
  const umurJam=(Date.now()-new Date(`${v.tanggal}T${v.jam||'08:00'}:00+07:00`).getTime())/36e5;
  if (umurJam<48) return ['baru','Masih baru'];
  const yt=v.platform==='youtube';
  if (v.views>=(yt?200:300)) return ['bagus','Bagus'];
  if (v.views<(yt?50:100)) return ['sepi','Sepi'];
  return ['lumayan','Lumayan'];
}

function render(d){
  const t=todayWIB();
  $('#upd').textContent='Data terakhir dari tim AI: '+new Date(d.diperbarui).toLocaleString('id-ID',{timeZone:TZ,weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+' WIB';

  // jadwal
  const now=Date.now();
  const up=(d.jadwal||[]).filter(j=>new Date(`${j.tanggal}T${j.jam}:00+07:00`).getTime()>now-5*60000).sort((a,b)=>(a.tanggal+a.jam).localeCompare(b.tanggal+b.jam));
  const byDay={}; up.forEach(j=>(byDay[j.tanggal]=byDay[j.tanggal]||[]).push(j));
  $('#jadwal').innerHTML=up.length?Object.keys(byDay).map(day=>`<div class="day">${esc(labelHari(day))} · ${byDay[day].length} video</div>`+byDay[day].map(j=>{
    const cls=j.status==='terjadwal'?'terjadwal':j.status==='gagal'?'gagal':'siap';
    const stTxt=j.status==='terjadwal'?'✓ Terjadwal':j.status==='gagal'?'Gagal':'Video siap, dijadwalkan pagi itu';
    return `<div class="item"><div class="jam">${esc(j.jam)}</div><div class="isi"><div class="jd">${esc(j.judul)}</div><div class="meta">${pfHtml(j.platform||[])}<span class="tag">${esc(FMT[j.format]||j.format||'')}</span><span class="st ${cls}">${stTxt}</span></div></div></div>`;
  }).join('')).join(''):'<div class="empty">Belum ada video yang dijadwalkan.</div>';

  // performa
  const pf=(d.performa||[]).slice().sort((a,b)=>(b.tanggal+b.jam).localeCompare(a.tanggal+a.jam));
  $('#performa').innerHTML=pf.length?pf.map(v=>{
    const n=nilai(v); const pn=NET[v.platform]||[v.platform,'var(--muted)'];
    return `<div class="perf"><div class="isi"><a href="${esc(v.link)}" target="_blank" rel="noopener"><div class="jd">${esc(v.judul)}</div></a><div class="meta"><span class="pf"><i style="background:${pn[1]}"></i>${esc(pn[0])}</span><span class="tag">${esc(FMT[v.format]||v.format||'')}</span><span class="sub">${esc(labelHari(v.tanggal))} ${esc(v.jam||'')}</span></div></div><div class="vw"><b>${num(v.views)}</b><span class="sub">views</span><br>${n?`<span class="badge ${n[0]}">${n[1]}</span>`:'<span class="badge baru">Belum ada data</span>'}</div></div>`;
  }).join(''):'<div class="empty">Belum ada video yang tayang.</div>';

  // ide
  const ide=(d.ide||[]).slice().sort((a,b)=>a.tanggal.localeCompare(b.tanggal));
  $('#ideList').innerHTML=ide.length?ide.map(i=>`<div class="item"><div class="jam" style="font-size:13px">${esc(labelHari(i.tanggal))}</div><div class="isi"><div class="jd">${esc(i.judul)}</div><div class="meta"><span class="pf">${esc(i.platform)}</span><span class="tag">${esc(FMT[i.format]||i.format||'')}</span><span class="st siap">${esc(i.status||'ide')}</span></div></div></div>`).join(''):'<div class="empty">Ide minggu depan muncul tiap Minggu malam.</div>';

  // perintah yang sudah dikerjakan
  const done=d.perintah_selesai||[];
  $('#doneList').innerHTML=done.length?'<div class="day">Perintah terakhir</div>'+done.slice(0,5).map(p=>`<div class="done"><b>${esc(p.perintah)}</b><br>${esc(p.hasil||'')}</div>`).join(''):'';

  // ringkasan
  const hariIni=up.filter(j=>j.tanggal===t).length;
  const dinilai=pf.map(v=>[v,nilai(v)]).filter(x=>x[1]&&x[1][0]!=='baru');
  const best=pf.filter(v=>v.views!=null).sort((a,b)=>b.views-a.views)[0];
  const sepi=dinilai.filter(x=>x[1][0]==='sepi').length;
  const total=pf.reduce((s,v)=>s+(v.views||0),0);
  let kalimat=hariIni?`Hari ini masih ada <b style="display:inline;font-size:inherit">${hariIni}</b> video yang bakal tayang.`:'Semua video hari ini sudah tayang.';
  if (best) kalimat+=` Paling rame: “${esc(best.judul)}” (${num(best.views)} views).`;
  if (d.catatan) kalimat+=` ${esc(d.catatan)}`;
  $('#hero').innerHTML=`<p>${kalimat}</p><div class="nums"><div><b>${up.length}</b><span>antre tayang</span></div><div><b>${num(total)}</b><span>total views</span></div><div><b>${sepi}</b><span>video sepi</span></div></div>`;
}

fetch('data.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(render).catch(()=>{
  const e=$('#loadErr'); e.hidden=false;
  e.textContent='Data belum bisa dibaca. Pastikan file data.json ada di folder yang sama, dan halaman dibuka lewat alamat website (bukan dobel-klik file).';
  $('#hero').innerHTML='<p>Belum ada data.</p>';
});

// perintah
document.querySelectorAll('#chips button').forEach(b=>b.onclick=()=>{$('#cmdText').value=b.textContent;$('#cmdText').focus()});
$('#sendHint').textContent=GITHUB_REPO?'Perintah masuk ke GitHub, tim AI cek tiap pagi & malam.':'Perintah akan disalin. Tempel di chat Claude.';
$('#send').onclick=async()=>{
  const txt=$('#cmdText').value.trim(); const ok=$('#sendOk');
  if(!txt){$('#cmdText').focus();return}
  if(GITHUB_REPO){
    const url=`https://github.com/${GITHUB_REPO}/issues/new?labels=perintah&title=${encodeURIComponent('Perintah: '+txt.slice(0,60))}&body=${encodeURIComponent(txt)}`;
    window.open(url,'_blank','noopener');
    ok.hidden=false; ok.textContent='Halaman GitHub kebuka. Tinggal tekan "Create" / "Submit new issue".';
  } else {
    try{await navigator.clipboard.writeText(txt);ok.textContent='Tersalin! Buka chat Claude lalu tempel (paste).'}
    catch(_){$('#cmdText').select();ok.textContent='Teks sudah dipilih. Salin, lalu tempel di chat Claude.'}
    ok.hidden=false;
  }
};
</script>
</body>
</html>
