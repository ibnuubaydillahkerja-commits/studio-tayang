<!doctype html>
<html lang="id" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="google" content="notranslate">
<title>Studio Tayang Ibnu</title>
<meta name="theme-color" content="#0e1120">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
/* Layout: kantor di atas, 1 kalimat status, 3 kotak ringkas, lalu 4 tab (satu tampil sekali). Tenang, gelap, satu warna aksen. */
:root{
  --bg:#0e1120; --card:#171b2e; --card2:#1e2340; --ink:#eef0f7; --muted:#98a0ba; --line:#262c47;
  --accent:#ff8a3d; --good:#4cd38a; --good-bg:rgba(76,211,138,.13); --mid:#f2c14e; --mid-bg:rgba(242,193,78,.13);
  --bad:#ff6b6b; --bad-bg:rgba(255,107,107,.13); --new:#9fb0ea; --new-bg:rgba(159,176,234,.13);
  --yt:#ff5c5c; --tt:#e9ecf7; --ig:#f06595; --fb:#5c9cff;
  --f:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px))}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--good-bg)}
.live.stale i{background:var(--mid);box-shadow:0 0 0 3px var(--mid-bg)}

/* kantor */
.stage{position:relative;width:100%;aspect-ratio:4/3;margin-top:10px;border-radius:16px;overflow:hidden;background:#0b0d18}
.room{position:absolute;width:122%;height:122%;left:-11%;top:-15%;background:center/100% 100% no-repeat}
.obj{position:absolute;transform:translate(-50%,-100%);pointer-events:none}
.obj img{display:block;width:100%;height:auto}
.char{position:absolute;transform:translate(-50%,-100%);transition:left 2.4s ease-in-out,top 2.4s ease-in-out;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.char img.spr{height:100%;width:auto;filter:drop-shadow(0 0 1px var(--c)) drop-shadow(0 1px 0 #000);animation:breathe 3s ease-in-out infinite}
.char.work img.spr{animation:type .5s steps(2) infinite}
.char .fx{position:absolute;top:-22%;width:34%;min-width:14px;animation:pop 1.6s ease-in-out infinite}
.char .nm{position:absolute;top:100%;margin-top:1px;font-size:clamp(8px,2.2vw,11px);font-weight:700;white-space:nowrap;padding:1px 6px;border-radius:999px;background:rgba(10,12,24,.82);border:1px solid var(--c);color:#fff}
.char:not(.work):not(.sel) .nm{display:none}
.char.sel .nm{background:var(--accent);border-color:var(--accent);color:#1a0c03}
@keyframes breathe{50%{transform:translateY(-1px)}}
@keyframes type{50%{transform:translateY(-1.5px)}}
@keyframes pop{50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.char,.char img.spr,.char .fx{animation:none!important;transition:none!important}}
.credit{font-size:10px;color:var(--muted);margin-top:4px;text-align:right}
.credit a{color:var(--muted)}

/* status */
.now{margin-top:10px;background:var(--card);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.now .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
.now b{font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.tile{background:var(--card);border-radius:14px;padding:10px 12px;min-width:0}
.tile .k{font-size:11px;color:var(--muted);font-weight:600}
.tile .v{font-size:20px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.tile .v{font-size:17px}}

/* tab */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--card);border-radius:14px;padding:4px;margin-top:16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.tabs button{font:700 13px var(--f);color:var(--muted);background:none;border:0;border-radius:10px;padding:9px 4px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--card2);color:var(--ink)}
.panel{margin-top:10px}
.group{font-size:12px;color:var(--muted);font-weight:700;margin:14px 2px 6px;text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:12px;margin-bottom:6px}
.row .t{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;width:48px;flex:none}
.row .b{min-width:0;flex:1}
.row .j{font-weight:600;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .m{font-size:12px;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.pf{display:inline-flex;align-items:center;gap:4px}
.pf i{width:7px;height:7px;border-radius:50%;display:inline-block}
.chip{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.chip.ok{background:var(--good-bg);color:var(--good)} .chip.mid{background:var(--mid-bg);color:var(--mid)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.new{background:var(--new-bg);color:var(--new)}
.row a{color:inherit;text-decoration:none}
.vw{text-align:right;flex:none}
.vw b{display:block;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);background:var(--card);border-radius:14px;padding:18px;text-align:center}
.note{font-size:12px;color:var(--muted);margin:2px 2px 8px}
textarea{width:100%;min-height:90px;font:15px var(--f);border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chips button{font:600 13px var(--f);border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;cursor:pointer}
.go{width:100%;font:800 16px var(--f);border:0;border-radius:14px;background:var(--accent);color:#1a0c03;padding:14px;cursor:pointer}
.ok-msg{font-size:13px;color:var(--good);margin-top:8px}

/* lembar detail robot */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:20px 20px 0 0;padding:16px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-width:720px;margin:0 auto}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet .who{display:flex;gap:12px;align-items:center}
.sheet .who img{height:64px}
.sheet h3{margin:0;font-size:18px}
.sheet .kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.sheet .kv span:first-child{color:var(--muted);flex:none}
.sheet .kv span:last-child{text-align:right}
.sheet .close{margin-top:12px;width:100%;font:700 14px var(--f);border:0;border-radius:12px;background:var(--card2);color:var(--ink);padding:12px;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible,.char:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Studio Tayang</h1>
    <div class="live" id="live"><i></i><span id="liveTxt">menyambung…</span></div>
  </div>

  <div class="stage" role="img" aria-label="Kantor tim AI"><div class="room" id="stage"></div></div>
  <div class="credit">Gambar kantor: <a href="https://github.com/W17ant/Claude-Office" target="_blank" rel="noopener">Claude-Office</a> (MIT)</div>

  <div class="now" id="now"><span class="dot" style="background:var(--muted)"></span><div>Memuat…</div></div>
  <div class="tiles">
    <div class="tile"><div class="k">Tayang berikutnya</div><div class="v" id="tNext">–</div><div class="s" id="tNextS">&nbsp;</div></div>
    <div class="tile"><div class="k">Views 7 hari</div><div class="v" id="tViews">–</div><div class="s" id="tViewsS">&nbsp;</div></div>
    <div class="tile"><div class="k">Paling rame</div><div class="v" id="tBest">–</div><div class="s" id="tBestS">&nbsp;</div></div>
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" data-tab="jadwal" aria-selected="true">Jadwal</button>
    <button role="tab" data-tab="views" aria-selected="false">Views</button>
    <button role="tab" data-tab="ide" aria-selected="false">Ide</button>
    <button role="tab" data-tab="perintah" aria-selected="false">Perintah</button>
  </div>

  <div class="panel" data-panel="jadwal" id="pJadwal"><div class="empty">Memuat…</div></div>
  <div class="panel" data-panel="views" id="pViews" hidden><div class="empty">Memuat…</div></div>
  <div class="panel" data-panel="ide" id="pIde" hidden><div class="empty">Memuat…</div></div>
  <div class="panel" data-panel="perintah" hidden>
    <textarea id="cmdText" placeholder="Tulis perintah, contoh: bikin video bangun rumah kayu buat besok jam 10"></textarea>
    <div class="chips" id="chips">
      <button type="button">Bikin video bangun rumah lagi</button>
      <button type="button">Bikin fakta hewan buat besok</button>
      <button type="button">Bikin tips CSS buat TikTok</button>
      <button type="button">Majuin video besok ke jam 07:00</button>
    </div>
    <button type="button" class="go" id="send">Kirim perintah</button>
    <div class="note" style="margin-top:8px">Kebuka GitHub, tinggal tekan "Submit new issue". Tim AI ngerjain tiap jam.</div>
    <div class="ok-msg" id="sendOk" hidden></div>
    <div id="doneList"></div>
  </div>
</div>

<div class="sheet-bg" id="sheetBg" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetName"></div>

<script>
const REPO="ibnuubaydillahkerja-commits/studio-tayang";
const TZ='Asia/Bangkok';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>n==null?'–':Number(n).toLocaleString('id-ID');
const NET={youtube:['YouTube','var(--yt)'],tiktok:['TikTok','var(--tt)'],instagram:['Instagram','var(--ig)'],facebook:['Facebook','var(--fb)']};
const FMT={DuckFact:'Fakta Kwek',BuildHouse:'Bangun rumah',TechTip:'Tips coding',WebShowcase:'Pamer website',lainnya:'Lainnya'};
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];

function wib(d=new Date()){
  const p=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',weekday:'short',hour12:false}).formatToParts(d);
  const g=t=>p.find(x=>x.type===t).value, h=+g('hour')%24, m=+g('minute');
  return {date:`${g('year')}-${g('month')}-${g('day')}`,wd:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(g('weekday')),h,m,min:h*60+m};
}
const addDays=(d,n)=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
function labelHari(d){const t=wib().date;if(d===t)return'Hari ini';if(d===addDays(t,1))return'Besok';if(d===addDays(t,2))return'Lusa';return new Date(d+'T12:00:00Z').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'short',timeZone:'UTC'})}

// ===== kantor (aset Claude-Office, MIT) =====
const A='assets/';
const FURN=[ // x,y dalam % ruangan 800x600, w = lebar/800
 ['furn/standing-desk-left-rear',42.4,50.4,84],['furn/standing-desk-left-front',46.7,53,84],['furn/standing-desk-right-front',39.9,55.2,84],
 ['furn/standing-desk-left-rear',31.4,64.8,84],['furn/standing-desk-left-front',35.4,67.5,84],['furn/standing-desk-right-front',27.9,70,84],
 ['furn/standing-desk-left-rear',59,73.7,84],['furn/standing-desk-left-front',62.6,76,84],['furn/standing-desk-right-front',55.4,78.7,84],['furn/standing-desk-right-rear',66.6,71.1,84],
 ['furn/coffee-off',78.5,50.2,40],['furn/filling-closed',45,56.5,42],['furn/monstera-plant',91.9,64.7,50],['furn/snake-plant',43.2,37.9,40],
 ['furn/money-tree',32,71.2,42],['furn/money-tree',89.2,65.7,42],['furn/monstera-plant',60.2,80.4,50],['furn/printer-working',85.4,56.8,55],
];
// tim: kursi kerja (desk) & tempat istirahat
const TIM=[
 {id:'riset',nama:'Riset',spr:'explore-1',c:'#4dabf7',tugas:'Cari topik & tren yang lagi rame, cek video mana yang laku',jadwal:[[[0],'18:40','19:40']],ket:'Tiap Minggu 18:40',
  desk:[38.5,55.2,'rear-left',58],rest:[53.3,46.6,'rear-left']},
 {id:'penulis',nama:'Penulis',spr:'Frontend-dev-1',c:'#f783ac',tugas:'Nulis naskah video: fakta Kwek, bangun rumah, tips coding',jadwal:[[[0],'18:50','19:50']],ket:'Tiap Minggu 18:50 + kalau ada perintah',
  desk:[48.9,52.9,'rear-right',70],rest:[56,47.7,'front-right']},
 {id:'penilaiNaskah',nama:'Cek Naskah',spr:'security-audit-1',c:'#ffd43b',tugas:'Cek fakta benar, ramah anak, hook-nya kuat',jadwal:[[[0],'19:00','20:00']],ket:'Tiap Minggu 19:00',
  desk:[38.8,43.6,'front-left',30],rest:[73.5,56.7,'rear-left']},
 {id:'render',nama:'Editor',spr:'dev-1',c:'#ff922b',tugas:'Bikin animasi + suara Ardi di laptop lo, kirim ke Google Drive',jadwal:[[null,'21:00','23:59']],ket:'Tiap malam 21:00 (laptop harus nyala)',
  desk:[25.8,71,'rear-left',85],rest:[76.2,58.4,'front-right']},
 {id:'penilaiVideo',nama:'Cek Video',spr:'employee-1',c:'#69db7c',tugas:'Nonton video sebagai penonton & anak SD sebelum tayang',jadwal:[[null,'06:11','06:45']],ket:'Tiap pagi 06:11',
  desk:[37.9,68.2,'rear-right',85],rest:[47.8,57.6,'front-right']},
 {id:'posting',nama:'Posting',spr:'dev-2',c:'#da77f2',tugas:'Jadwalin ke YouTube, TikTok, IG, FB jam 08:00 & 10:00',jadwal:[[null,'06:15','06:50']],ket:'Tiap pagi 06:15',
  desk:[52.7,78.8,'rear-left',95],rest:[81,63,'rear-left']},
 {id:'laporan',nama:'Analis',spr:'Claude-1',c:'#38d9a9',tugas:'Update views & halaman ini, ngerjain perintah lo',jadwal:[[null,'07:17','07:35'],[null,'08:17','08:30'],[null,'09:17','09:30'],[null,'10:17','10:30'],[null,'11:17','11:30'],[null,'12:17','12:30'],[null,'13:17','13:35'],[null,'14:17','14:30'],[null,'15:17','15:30'],[null,'16:17','16:30'],[null,'17:17','17:30'],[null,'18:17','18:30'],[null,'19:17','19:30'],[null,'20:17','20:35'],[null,'21:17','21:30'],[null,'22:17','22:30']],ket:'Tiap jam (07:17 – 22:17)',
  desk:[65.9,75.8,'rear-right',95],rest:[64,46.6,'rear-right']},
];
const toMin=s=>{const[a,b]=s.split(':');return +a*60+ +b};
const working=(t,n)=>t.jadwal.some(([d,f,to])=>(d==null||d.includes(n.wd))&&n.min>=toMin(f)&&n.min<=toMin(to));
function nextRun(t,n){for(let k=0;k<8;k++){const wd=(n.wd+k)%7;const c=t.jadwal.filter(([d])=>d==null||d.includes(wd)).map(([,f])=>toMin(f)).filter(m=>k>0||m>n.min).sort((a,b)=>a-b);
  if(c.length){const m=c[0];return (k===0?'hari ini ':k===1?'besok ':HARI[wd]+' ')+String(m/60|0).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}}return '-'}

const stage=$('#stage');
FURN.forEach(([src,x,y,w])=>{const d=document.createElement('div');d.className='obj';d.style.cssText=`left:${x}%;top:${y}%;width:${w/8}%;z-index:${Math.round(y)}`;d.innerHTML=`<img src="${A+src}.png" alt="">`;stage.appendChild(d)});
const els={};
TIM.forEach(t=>{const d=document.createElement('div');d.className='char';d.tabIndex=0;d.setAttribute('role','button');d.setAttribute('aria-label',t.nama);d.style.setProperty('--c',t.c);d.style.height='13%';
  d.innerHTML=`<img class="fx" alt=""><img class="spr" alt=""><span class="nm">${esc(t.nama)}</span>`;
  d.onclick=()=>openSheet(t.id); d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openSheet(t.id)}};
  stage.appendChild(d); els[t.id]=d});
let selected=null, DATA={};
function placeAll(){
  const n=wib(); stage.style.backgroundImage=`url(${A}${n.h>=18||n.h<6?'room-night':'room-day'}.png)`;
  TIM.forEach(t=>{const on=working(t,n), s=on?t.desk:t.rest, el=els[t.id];
    el.style.left=s[0]+'%'; el.style.top=s[1]+'%'; el.style.zIndex=s[3]??Math.round(s[1]);
    el.classList.toggle('work',on); el.classList.toggle('sel',selected===t.id);
    const spr=`${A}char/${t.spr}-${s[2]}.png`; const img=el.querySelector('.spr'); if(img.getAttribute('src')!==spr)img.src=spr;
    el.querySelector('.fx').src=A+'fx/'+(on?'typing':'sleeping')+'.png';
  });
  renderNow(n);
}
function renderNow(n){
  const on=TIM.filter(t=>working(t,n));
  const box=$('#now');
  if(on.length){box.innerHTML=`<span class="dot" style="background:var(--good)"></span><div>${on.map(t=>`<b>${esc(t.nama)}</b> lagi ${esc(t.tugas.charAt(0).toLowerCase()+t.tugas.slice(1))}`).join('<br>')}</div>`}
  else{const nx=TIM.map(t=>({t,s:nextRun(t,n)})).sort((a,b)=>{const k=x=>(x.startsWith('hari ini')?0:x.startsWith('besok')?1:2)+x.slice(-5);return k(a.s).localeCompare(k(b.s))})[0];
    box.innerHTML=`<span class="dot" style="background:var(--muted)"></span><div>Semua lagi istirahat. Berikutnya <b>${esc(nx.t.nama)}</b> mulai ${esc(nx.s)}.</div>`}
}
function openSheet(id){
  selected=id; const t=TIM.find(x=>x.id===id), n=wib(), on=working(t,n), log=(DATA.tim||{})[id]||{};
  $('#sheet').innerHTML=`<div class="grab"></div><div class="who"><img src="${A}char/${t.spr}-front-left.png" alt=""><div><h3 id="sheetName">${esc(t.nama)}</h3><span class="chip ${on?'ok':'new'}">${on?'● Lagi kerja':'Istirahat'}</span></div></div>
   <div style="margin:10px 0 4px">${esc(t.tugas)}</div>
   <div class="kv"><span>Jam kerja</span><span>${esc(t.ket)}</span></div>
   <div class="kv"><span>Kerja berikutnya</span><span>${on?'sekarang':esc(nextRun(t,n))}</span></div>
   <div class="kv"><span>Terakhir ngerjain</span><span>${esc(log.catatan||'belum ada catatan')}${log.waktu?'<br><span style="color:var(--muted);font-size:12px">'+esc(new Date(log.waktu).toLocaleString('id-ID',{timeZone:TZ,weekday:'long',hour:'2-digit',minute:'2-digit'}))+'</span>':''}</span></div>
   <button class="close" type="button" id="sheetClose">Tutup</button>`;
  $('#sheet').hidden=false;$('#sheetBg').hidden=false;$('#sheetClose').focus();$('#sheetClose').onclick=closeSheet;placeAll();
}
function closeSheet(){selected=null;$('#sheet').hidden=true;$('#sheetBg').hidden=true;placeAll()}
$('#sheetBg').onclick=closeSheet; addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
placeAll(); setInterval(placeAll,30000);

// ===== tab =====
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b?'true':'false'));
  document.querySelectorAll('.panel').forEach(p=>p.hidden=p.dataset.panel!==b.dataset.tab);
  try{localStorage.setItem('tab',b.dataset.tab)}catch(_){}
});
try{const t=localStorage.getItem('tab');if(t)document.querySelector(`.tabs [data-tab="${t}"]`)?.click()}catch(_){}

// ===== data (cek tiap 1 menit) =====
const pf=l=>l.map(p=>{const n=NET[p]||[p,'var(--muted)'];return `<span class="pf"><i style="background:${n[1]}"></i>${esc(n[0])}</span>`}).join('');
function nilai(v){if(v.views==null)return['new','Belum ada data'];const u=(Date.now()-new Date(`${v.tanggal}T${v.jam||'08:00'}:00+07:00`))/36e5;if(u<48)return['new','Masih baru'];const yt=v.platform==='youtube';if(v.views>=(yt?200:300))return['ok','Bagus'];if(v.views<(yt?50:100))return['bad','Sepi'];return['mid','Lumayan']}
function render(d){
  DATA=d;
  const now=Date.now();
  const up=(d.jadwal||[]).filter(j=>new Date(`${j.tanggal}T${j.jam}:00+07:00`)>now-5*60000).sort((a,b)=>(a.tanggal+a.jam).localeCompare(b.tanggal+b.jam));
  const by={};up.forEach(j=>(by[j.tanggal]=by[j.tanggal]||[]).push(j));
  $('#pJadwal').innerHTML=up.length?Object.keys(by).map(day=>`<div class="group">${esc(labelHari(day))}</div>`+by[day].map(j=>{const st=j.status==='terjadwal'?['ok','Terjadwal']:j.status==='gagal'?['bad','Gagal']:['new','Video siap'];
    return `<div class="row"><div class="t">${esc(j.jam)}</div><div class="b"><div class="j">${esc(j.judul)}</div><div class="m">${pf(j.platform||[])}<span class="chip ${st[0]}">${st[1]}</span></div></div></div>`}).join('')).join(''):'<div class="empty">Belum ada video yang dijadwalkan.</div>';
  const perf=(d.performa||[]).slice().sort((a,b)=>(b.tanggal+b.jam).localeCompare(a.tanggal+a.jam));
  $('#pViews').innerHTML='<div class="note">Dinilai setelah 2 hari. YouTube bagus ≥ 200 · TikTok/IG ≥ 300 views.</div>'+(perf.length?perf.map(v=>{const n=nilai(v),p=NET[v.platform]||[v.platform,'var(--muted)'];
    return `<a class="row" href="${esc(v.link)}" target="_blank" rel="noopener"><div class="b"><div class="j">${esc(v.judul)}</div><div class="m"><span class="pf"><i style="background:${p[1]}"></i>${esc(p[0])}</span><span>${esc(labelHari(v.tanggal))}</span></div></div><div class="vw"><b>${num(v.views)}</b><span class="chip ${n[0]}">${n[1]}</span></div></a>`}).join(''):'<div class="empty">Belum ada video yang tayang.</div>');
  const ide=(d.ide||[]).slice().sort((a,b)=>a.tanggal.localeCompare(b.tanggal));
  const byI={};ide.forEach(i=>(byI[i.tanggal]=byI[i.tanggal]||[]).push(i));
  $('#pIde').innerHTML=ide.length?Object.keys(byI).map(day=>`<div class="group">${esc(labelHari(day))}</div>`+byI[day].map(i=>`<div class="row"><div class="b"><div class="j">${esc(i.judul)}</div><div class="m"><span>${esc(i.platform)}</span><span>${esc(FMT[i.format]||i.format||'')}</span></div></div></div>`).join('')).join(''):'<div class="empty">Ide baru muncul tiap Minggu malam.</div>';
  const done=d.perintah_selesai||[];
  $('#doneList').innerHTML=done.length?'<div class="group">Perintah terakhir</div>'+done.slice(0,5).map(p=>`<div class="row"><div class="b"><div class="j">${esc(p.perintah)}</div><div class="m">${esc(p.hasil||'')}</div></div></div>`).join(''):'';
  // kotak ringkas
  const nx=up[0]; $('#tNext').textContent=nx?nx.jam:'–'; $('#tNextS').textContent=nx?(labelHari(nx.tanggal)+' · '+nx.judul):'belum ada';
  const t7=addDays(wib().date,-7), last7=perf.filter(v=>v.tanggal>=t7);
  $('#tViews').textContent=num(last7.reduce((s,v)=>s+(v.views||0),0)); $('#tViewsS').textContent=last7.length+' video';
  const best=perf.filter(v=>v.views!=null).sort((a,b)=>b.views-a.views)[0];
  $('#tBest').textContent=best?num(best.views):'–'; $('#tBestS').textContent=best?best.judul:'belum ada';
  if(selected)openSheet(selected);
}
function setLive(ok){const l=$('#live');l.classList.toggle('stale',!ok);
  const t=DATA.diperbarui?new Date(DATA.diperbarui):null; const m=t?Math.round((Date.now()-t)/60000):null;
  $('#liveTxt').textContent=!ok?'offline':m==null?'–':m<1?'baru aja':m<60?`update ${m} mnt lalu`:`update ${Math.round(m/60)} jam lalu`}
async function load(){
  try{const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;render(await r.json());setLive(true)}
  catch(_){setLive(false);if(!DATA.jadwal){$('#pJadwal').innerHTML='<div class="empty">Data belum bisa dibaca. Buka lewat alamat website.</div>'}}
}
load(); setInterval(load,60000); document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});

// ===== perintah =====
document.querySelectorAll('#chips button').forEach(b=>b.onclick=()=>{$('#cmdText').value=b.textContent;$('#cmdText').focus()});
$('#send').onclick=()=>{const t=$('#cmdText').value.trim();if(!t){$('#cmdText').focus();return}
  const a=document.createElement('a');a.href=`https://github.com/${REPO}/issues/new?labels=perintah&title=${encodeURIComponent('Perintah: '+t.slice(0,60))}&body=${encodeURIComponent(t)}`;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
  const ok=$('#sendOk');ok.hidden=false;ok.textContent='GitHub kebuka. Tekan "Submit new issue" ya.'};
</script>
</body>
</html>
